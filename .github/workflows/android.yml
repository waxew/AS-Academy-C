name: Android App CI

on:
  push:
    paths: ["app/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android.yml"]
  pull_request:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C course
        uses: actions/checkout@v4
        with:
          path: AS-Academy-C

      - name: Checkout shared Core
        uses: actions/checkout@v4
        with:
          repository: waxew/AS-Academy-Core
          path: AS-Academy-Core

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: AS-Academy-C
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: as-academy-c-debug
          path: AS-Academy-C/app/build/outputs/apk/debug/*.apk
